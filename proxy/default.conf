# Docker's DNS, asked per request: a recreated api or panel container gets a
# new IP, and a proxy_pass with a fixed host keeps the one from startup (502).
# With a variable nginx resolves at request time and passes the original URI.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name api.insulink.de;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.insulink.de;
    # Meal photos travel base64 in the JSON body (up to 2 MB decoded).
    client_max_body_size 4m;
    ssl_certificate /etc/letsencrypt/live/api.insulink.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.insulink.de/privkey.pem;

    location / {
        set $upstream http://api:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name panel.insulink.de;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name panel.insulink.de;
    ssl_certificate /etc/letsencrypt/live/panel.insulink.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.insulink.de/privkey.pem;

    location / {
        set $upstream http://panel:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}