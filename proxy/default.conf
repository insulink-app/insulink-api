# Docker's DNS, asked per request: a recreated api or panel container gets a
# new IP, and a proxy_pass with a fixed host keeps the one from startup (502).
# With a variable nginx resolves at request time and passes the original URI.
resolver 127.0.0.11 valid=10s ipv6=off;

server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;

# Rate limits per client address, on both hosts (the panel proxies /v1/ to the
# api too). $uri is decoded and normalised, so an encoded spelling of a path
# falls under the same limit. An empty key is not limited. The api keeps its
# own per-account lock on top of this; these only stop floods.
map $uri $auth_limit_key {
    ~^/v1/(signin|signup|refresh)/ $binary_remote_addr;
    default "";
}
map $uri $estimate_limit_key {
    ~^/v1/nutrition/estimate/ $binary_remote_addr;
    default "";
}
limit_req_zone $auth_limit_key zone=auth:10m rate=20r/m;
limit_req_zone $estimate_limit_key zone=estimate:10m rate=6r/m;
limit_req_status 429;

# For the container healthcheck only: 8079 is not published in compose.
server {
    listen 8079;
    location = /healthz {
        access_log off;
        return 200;
    }
}

# A request for any other name (a bare IP, a stray DNS entry) is turned away
# instead of landing on the first site below.
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name api.insulink.de;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.insulink.de;
    # Meal photos travel base64 in the JSON body (up to 2 MB decoded).
    client_max_body_size 4m;
    ssl_certificate /etc/letsencrypt/live/api.insulink.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.insulink.de/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_req zone=auth burst=20 nodelay;
    limit_req zone=estimate burst=3 nodelay;

    location / {
        set $upstream http://api:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name panel.insulink.de;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name panel.insulink.de;
    ssl_certificate /etc/letsencrypt/live/panel.insulink.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.insulink.de/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    limit_req zone=auth burst=20 nodelay;
    limit_req zone=estimate burst=3 nodelay;

    location / {
        set $upstream http://panel:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
