# Pinned, so the named volumes (pgdata) stay the same whatever the folder on
# the server is called; the project name used to come from the folder name.
name: insulink
services:
  postgres:
    image: postgres:latest
    container_name: insulink-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      # From .env next to this file (not committed); this file is public.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: insulink
    # Localhost only: Docker's port rules bypass ufw, so a bare "5432:5432"
    # puts the database on the internet. The host still reaches it for
    # training the predictor.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  # Built and published by CI on every push to main; the server pulls it on a
  # timer (docs/AUTO_DEPLOY.md). The image holds no secrets, they are mounted.
  api:
    image: ghcr.io/insulink-app/insulink-api:latest
    container_name: insulink-api
    restart: always
    # From .env next to this file (not committed); see docs/MEAL_PHOTO_ESTIMATE.md.
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - ./api/configurations:/api/configurations:ro
      - ./api/geo:/api/geo:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [data, edge]
    # The version endpoint answers once Spring is up; boot takes about 10 s.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/v1/"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
  # Internal glucose-forecast service (insulink-predictor sibling repo). Not
  # published — only the api reaches it at http://predictor:8000 (see the
  # [prediction] section in configurations/config.ini). Published by the
  # predictor repo's CI and pulled on the timer like the api; the models stay
  # on the host in ./predictor/artifacts.
  predictor:
    image: ghcr.io/insulink-app/insulink-predictor:latest
    container_name: insulink-predictor
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Reach Postgres over the compose network (service name "postgres", port 5432).
      # A read-only role once it exists (docs/DATABASE_ROLES.md); until
      # PREDICTOR_DB_PASSWORD is set in .env it stays on the superuser.
      DATABASE_URL: postgresql://${PREDICTOR_DB_USER:-postgres}:${PREDICTOR_DB_PASSWORD:-${POSTGRES_PASSWORD}}@postgres:5432/insulink
      # Guards POST /admin/retrain; unset leaves that endpoint switched off.
      ADMIN_TOKEN: ${PREDICTOR_ADMIN_TOKEN:-}
      MODELS_DIR: /app/artifacts/models   # per-user models (locally-mounted path)
      ENABLE_SCHEDULER: "true"
      RETRAIN_HOUR: "3"
    ports:
      - "127.0.0.1:8000:8000"
    networks: [data]
    # GET / is the predictor's health endpoint. The image has no curl, so
    # Python asks it.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    volumes:
      - ./predictor/artifacts:/app/artifacts
  # Admin panel (insulink-panel sibling repo). Serves the built React app and
  # proxies /v1/ to the api itself; the public proxy only terminates TLS for it.
  panel:
    image: ghcr.io/insulink-app/insulink-panel:latest
    container_name: insulink-panel
    restart: always
    environment:
      CORE_URL: http://api:8080
    depends_on:
      - api
    networks: [edge]
  proxy:
    image: nginx:1-alpine
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # nginx answers on an internal port (proxy/default.conf); the public
    # blocks only redirect to HTTPS, so asking them would test nothing.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8079/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: always
    ports:
      - "443:443"
      - "80:80"
    networks: [edge]
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
# Two networks, so a container only reaches what it talks to: the data side
# (Postgres, api, predictor) and the public edge (proxy, panel, api). The panel
# and the proxy cannot reach the database or the predictor at all.
networks:
  data:
  edge:
volumes:
  pgdata: