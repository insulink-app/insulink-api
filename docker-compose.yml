services:
  postgres:
    image: postgres:latest
    container_name: insulink-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: insulink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    container_name: insulink-api
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
  # Internal glucose-forecast service (insulink-predictor sibling repo). Not
  # published — only the api reaches it at http://predictor:8000 (see the
  # [prediction] section in configurations/config.ini). Train the model on the
  # host and mount it read-only; restart this service to pick up a retrain.
  predictor:
    build: ./predictor
    container_name: insulink-predictor
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Reach Postgres over the compose network (service name "postgres", port 5432).
      DATABASE_URL: postgresql://postgres:password@postgres:5432/insulink
      MODELS_DIR: /app/artifacts/models   # per-user models (locally-mounted path)
      ENABLE_SCHEDULER: "true"
      RETRAIN_HOUR: "3"
    ports:
      - "8000:8000"
    volumes:
      - ./predictor/artifacts:/app/artifacts
  # Admin panel (insulink-panel sibling repo). Serves the built React app and
  # proxies /v1/ to the api itself; the public proxy only terminates TLS for it.
  panel:
    build: ./panel
    container_name: insulink-panel
    restart: always
    environment:
      CORE_URL: http://api:8080
    depends_on:
      - api
  proxy:
    image: nginx:alpine
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    restart: always
    ports:
      - "443:443"
      - "80:80"
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
volumes:
  pgdata: